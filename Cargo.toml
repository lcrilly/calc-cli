[package]
name = "calcx"
version = "0.3.0"
edition = "2024"
description = "Evaluate arithmetic expressions and lists of numbers without shell quoting"
license = "MIT"
repository = "https://github.com/lcrilly/calcx"

[features]
default = []
# Big numbers and arbitrary precision, from the dashu crates.
precise = ["dep:dashu-int", "dep:dashu-ratio", "dep:dashu-float"]

[dependencies]
dashu-int = { version = "0.6.2", optional = true }
dashu-ratio = { version = "0.6.1", optional = true }
dashu-float = { version = "0.6.2", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
